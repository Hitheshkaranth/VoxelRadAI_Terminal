# Optional service adapters. Keep values empty to leave integrations disabled.
# Use with: docker compose -f compose.yaml -f compose.integrations.yaml up -d --build
services:
  api:
    environment:
      OIDC_ENABLED: ${OIDC_ENABLED:-false}
      OIDC_ISSUER: ${OIDC_ISSUER:-}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-}
      OIDC_PROVIDER_NAME: ${OIDC_PROVIDER_NAME:-Keycloak}
      OIDC_REQUIRED_ACR: ${OIDC_REQUIRED_ACR:-}
      OIDC_ALLOW_INSECURE_LOCALHOST: ${OIDC_ALLOW_INSECURE_LOCALHOST:-false}
      S3_STORAGE_ENABLED: ${S3_STORAGE_ENABLED:-false}
      S3_BUCKET: ${S3_BUCKET:-}
      AWS_REGION: ${AWS_REGION:-us-east-1}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_SESSION_TOKEN: ${AWS_SESSION_TOKEN:-}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT:-}
      S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-false}
      S3_SERVER_SIDE_ENCRYPTION: ${S3_SERVER_SIDE_ENCRYPTION:-AES256}
      S3_KMS_KEY_ID: ${S3_KMS_KEY_ID:-}
      S3_MAX_VOLUME_BYTES: ${S3_MAX_VOLUME_BYTES:-536870912}
      S3_OWNER_QUOTA_BYTES: ${S3_OWNER_QUOTA_BYTES:-5368709120}
      ALLOW_INSECURE_S3: ${ALLOW_INSECURE_S3:-false}
      DICOMWEB_BASE_URL: ${DICOMWEB_BASE_URL:-}
      DICOMWEB_USERNAME: ${DICOMWEB_USERNAME:-}
      DICOMWEB_PASSWORD: ${DICOMWEB_PASSWORD:-}
      DICOMWEB_ALLOW_HTTP: ${DICOMWEB_ALLOW_HTTP:-false}
