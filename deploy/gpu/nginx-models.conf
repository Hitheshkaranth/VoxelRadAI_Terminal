# GPU overlay model routes: workspace reads go to the API, which checks the session, applies the daily read cap
# and spreads reads over MODEL_UPSTREAMS with fail-over (server/src/modelPool.mjs).
location /lmstudio/ {
  proxy_pass $api$request_uri;
  proxy_set_header Host $host;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_buffering off;
  proxy_request_buffering off;
  proxy_read_timeout 600s;
}
location /txrv/ { return 404; }
location /maira/ { return 404; }
