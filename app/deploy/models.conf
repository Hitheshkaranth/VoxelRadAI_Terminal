# Default model routes: services private to the host; a valid session is required at the edge.
location /lmstudio/ {
  auth_request /_auth;
  rewrite ^/lmstudio/(.*)$ /$1 break;
  proxy_pass http://host.docker.internal:1234;
  proxy_buffering off;
  proxy_read_timeout 600s;
}
location /txrv/ {
  auth_request /_auth;
  rewrite ^/txrv/(.*)$ /$1 break;
  proxy_pass http://host.docker.internal:8765;
  proxy_read_timeout 600s;
}
location /maira/ {
  auth_request /_auth;
  rewrite ^/maira/(.*)$ /$1 break;
  proxy_pass http://host.docker.internal:8766;
  proxy_read_timeout 600s;
}
