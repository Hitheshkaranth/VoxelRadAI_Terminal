worker_processes auto;
pid /tmp/nginx.pid;
events { worker_connections 2048; }
http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  sendfile on;
  server_tokens off;
  client_body_temp_path /tmp/client_body;
  proxy_temp_path /tmp/proxy;
  fastcgi_temp_path /tmp/fastcgi;
  uwsgi_temp_path /tmp/uwsgi;
  scgi_temp_path /tmp/scgi;
  # Never record URLs, query strings, cookies or patient identifiers in access logs.
  access_log off;
  error_log /dev/stderr warn;
  resolver 127.0.0.11 valid=10s ipv6=off;
  server {
    listen 8080;
    root /usr/share/nginx/html;
    client_max_body_size 25m;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Frame-Options DENY always;
    add_header Permissions-Policy "camera=(), microphone=(self), geolocation=()" always;
    set $api http://api:8080;
    location = /healthz { return 200 'ok'; add_header Content-Type text/plain; }
    location = /_auth {
      internal;
      proxy_pass $api/api/auth/check;
      proxy_pass_request_body off;
      proxy_set_header Content-Length "";
      proxy_set_header Cookie $http_cookie;
    }
    location /api/ {
      proxy_pass $api$request_uri;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_read_timeout 60s;
      proxy_request_buffering off;
    }
    location /api/shared/ {
      # Bearer link tokens must not enter upstream-error logs.
      error_log /dev/null;
      proxy_pass $api$request_uri;
    }
    location = /api/oidc/callback {
      # Authorization codes must never enter upstream-error logs.
      error_log /dev/null;
      proxy_pass $api$request_uri;
    }
    # Model routes live in their own file so a deployment can swap them (deploy/gpu/nginx-models.conf sends
    # /lmstudio/ through the API's upstream pool instead of the host's LM Studio).
    include /etc/nginx/voxelrad/models.conf;
    # Share viewer: the token stays in the URL fragment, which never reaches this server.
    location = /shared { try_files /shared.html =404; expires -1; }
    location /assets/ { try_files $uri =404; expires 1y; }
    location / { try_files $uri $uri/ /index.html; expires -1; }
  }
}
